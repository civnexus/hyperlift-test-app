<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hyperlift Test App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 20%, #1e40af, #0f172a 70%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e2e8f0;
      }

      .card {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 32px 40px;
        max-width: 480px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        animation: fadeIn 1.2s ease-out;
        margin-bottom: 80px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 2rem;
        font-weight: 600;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.5;
        margin: 0;
      }

      footer {
        position: fixed;
        bottom: 20px;
        font-size: 0.85rem;
        opacity: 0.75;
        color: #cbd5e1;
        letter-spacing: 0.4px;
        user-select: none;
        text-align: center;
      }

      footer a {
        color: #93c5fd;
        text-decoration: none;
        font-weight: 500;
      }

      footer a:hover {
        text-decoration: underline;
      }

      .version {
        font-weight: 600;
        opacity: 0.9;
        margin-left: 4px;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>🚀 Hyperlift Test App</h1>
      <p>Hello World!</p>
      <p style="margin-top: 12px;">
        This is a test application to confirm Hyperlift updates after each commit.
      </p>
      <p style="margin-top: 16px; font-weight: 600;">Good luck, traveler.</p>
    </div>

    <footer>
      <div>
        Deployed via <strong>Starlight Hyperlift</strong>
        <span class="version">• v0.0.2</span>
      </div>

      <div id="timestamp" style="margin-top: 4px;">
        Establishing chronometric link…
      </div>

      <div style="margin-top: 4px;">
        <a href="https://github.com/civnexus/Hyperlift" target="_blank">
          View on GitHub
        </a>
      </div>
    </footer>

    <script>
      // Generate U.T.C. (Universal Temporal Coordinate)
      const now = new Date();
      const utcIso = now.toISOString().replace("T", " ").split(".")[0];

      document.getElementById("timestamp").textContent =
        "Last deployment signal received from Planet Earth • " +
        utcIso +
        " U.T.C. (Universal Temporal Coordinate)";
    </script>
  </body>
</html>
