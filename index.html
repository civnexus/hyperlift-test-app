<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hyperlift Test App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 20%, #1e40af, #0f172a 70%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #e2e8f0;
      }

      .card {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 32px 40px;
        max-width: 480px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        animation: fadeIn 1.2s ease-out;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 2rem;
        font-weight: 600;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.5;
        margin: 0;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>🚀 Hyperlift Test App</h1>
      <p>
        Hello World!<br /><br />
        This is a test application to see if Hyperlift will update once I commit
        changes.  
        <br /><br />
        <strong>Good luck!</strong>
      </p>
    </div>
  </body>
</html>
