<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>🚀 Interstellar Deployment Console</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e2e8f0;
        overflow: hidden;
      }

      /* Starfield Background */
      canvas#starfield {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      .card {
        background: rgba(15, 23, 42, 0.88);
        border-radius: 18px;
        padding: 32px 38px;
        max-width: 720px;
        width: 90%;
        text-align: left;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
        animation: fadeIn 1.1s ease-out;
        border: 1px solid rgba(148, 163, 184, 0.25);
        margin-top: 8vh;
      }

      .badge-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        font-size: 0.85rem;
        color: #a5b4fc;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .badge-pill {
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.25);
        border: 1px solid rgba(129, 140, 248, 0.7);
        font-size: 0.75rem;
      }

      h1 {
        margin: 6px 0 10px;
        font-size: 1.9rem;
        font-weight: 600;
      }

      .subtitle {
        margin: 0 0 22px;
        font-size: 1.08rem;
        color: #cbd5f5;
        opacity: 0.9;
      }

      .status-strip {
        display: flex;
        gap: 12px;
        margin-bottom: 22px;
        font-size: 0.95rem;
      }

      .status-pill {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(22, 163, 74, 0.15);
        border: 1px solid rgba(34, 197, 94, 0.7);
        color: #bbf7d0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #22c55e;
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
      }

      .dim-pill {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.12);
        border: 1px solid rgba(148, 163, 184, 0.6);
        color: #e5e7eb;
      }
